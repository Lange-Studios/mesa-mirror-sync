name: Sync Mesa mirror

on:
  schedule:
    - cron: '17 4 * * *' # quietest hour for merges to Mesa main (UTC)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mesa-mirror-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://gitlab.freedesktop.org/mesa/mesa.git
  FALLBACK: https://chromium.googlesource.com/external/gitlab.freedesktop.org/mesa/mesa
  MIRROR: Lange-Studios/mesa-mirror

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Seed objects from the mirror
        run: |
          git init -q --bare mesa.git
          git -C mesa.git config gc.auto 0
          # Pull existing history from GitHub (fast, in-network) so the
          # upstream fetch below only transfers what is new.
          git -C mesa.git fetch -q --no-tags "https://github.com/${MIRROR}.git" \
            '+refs/heads/*:refs/seed/heads/*' || echo "::notice::No seed available"

      - name: Fetch from upstream
        id: fetch
        run: |
          for i in 1 2 3 4 5; do
            if git -C mesa.git fetch --prune "$UPSTREAM" \
                 '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'; then
              echo "source=upstream" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "freedesktop fetch attempt $i failed"
            sleep $((i * 30))
          done
          echo "::warning::freedesktop unreachable; syncing branches from the Chromium mirror (no tags)"
          git -C mesa.git fetch --prune "$FALLBACK" '+refs/heads/*:refs/heads/*'
          echo "source=fallback" >> "$GITHUB_OUTPUT"

      - name: Drop malformed tags
        # 66 CVS-era annotated tags (e.g. R300_DRIVER_0, mesa_3_1) have a
        # tagger line with no space before the date, or no date at all.
        # Git tolerates them, but GitHub fsck-checks pushes and rejects the
        # whole push. No commit or tree is affected, only these tag objects.
        run: |
          git -C mesa.git for-each-ref refs/tags --format='%(objecttype) %(objectname) %(refname)' |
          while read -r type oid ref; do
            [ "$type" = tag ] || continue
            tagger=$(git -C mesa.git cat-file tag "$oid" | sed -n '/^tagger /p;/^$/q')
            [ -n "$tagger" ] || continue
            if ! printf '%s\n' "$tagger" | grep -Eq '> [0-9]+ [-+][0-9]{4}$'; then
              echo "Skipping ${ref#refs/tags/}"
              git -C mesa.git update-ref -d "$ref"
            fi
          done

      - name: Push to mirror
        env:
          DEPLOY_KEY: ${{ secrets.MESA_MIRROR_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Repository secret MESA_MIRROR_DEPLOY_KEY is missing or empty (Settings > Secrets and variables > Actions > Repository secrets)"
            exit 1
          fi
          install -m 700 -d ~/.ssh
          # Strip CRs in case the key was pasted with Windows line endings.
          printf '%s\n' "$DEPLOY_KEY" | tr -d '\r' > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          if ! ssh-keygen -y -f ~/.ssh/mirror_key > /dev/null; then
            echo "::error::MESA_MIRROR_DEPLOY_KEY is not a valid private key. Paste the whole private key file, including the BEGIN/END lines (not the .pub file)."
            exit 1
          fi
          echo "Using deploy key: $(ssh-keygen -l -f ~/.ssh/mirror_key)"
          GH_TOKEN=${{ github.token }} gh api meta --jq '.ssh_keys[] | "github.com " + .' > ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"

          refspecs=('+refs/heads/*:refs/heads/*')
          # Only mirror tags when we actually have the upstream tag list;
          # otherwise --prune would delete every tag.
          if [ "${{ steps.fetch.outputs.source }}" = upstream ]; then
            refspecs+=('+refs/tags/*:refs/tags/*')
          fi
          git -C mesa.git push --prune "git@github.com:${MIRROR}.git" "${refspecs[@]}"
